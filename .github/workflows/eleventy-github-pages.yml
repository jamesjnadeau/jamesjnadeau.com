# Builds the site once, runs the test suite against those exact bytes, and only
# then publishes to GitHub Pages. Pull requests are built and tested but never
# deployed.
#
# The site is moving to Netlify (netlify.toml), which builds and deploys it on
# its own, pull request previews included. Until jamesjnadeau.com points at
# Netlify, the deploy job below still publishes to Pages; once it does, delete
# the deploy job and keep build + test as the pull request gate.

name: Eleventy Github Pages

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Read-only by default. The deploy job re-grants itself exactly what Pages needs.
permissions:
  contents: read
  # Installing @jamesjnadeau/content-tools from GitHub Packages, which needs a
  # token even for a public package. The package grants this repository read
  # access in its "Manage Actions access" settings.
  packages: read

# One run per branch. A superseded pull request run is cancelled; a master run
# is not, because cancelling between test and deploy can leave Pages serving a
# half-published artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ubuntu-latest ships google-chrome-stable, so neither Puppeteer nor Lighthouse
# needs to download its own copy (~170MB) on every run.
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # @jamesjnadeau/content-tools comes from GitHub Packages (see .npmrc).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesjnadeau'

      # --omit=dev on purpose: the build must not depend on the test toolchain.
      # Netlify installs devDependencies too, so this is the only thing keeping
      # the dependencies/devDependencies split honest.
      - run: npm ci --omit=dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # @jamesjnadeau/content-tools comes from GitHub Packages (see .npmrc).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesjnadeau'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Test the artifact rather than rebuilding, so what ships is what passed.
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - run: npm run test:content
      - run: npm run test:html
      - run: npm run test:links
      - run: npm run test:a11y
      - run: npm run test:cms

      - name: Lighthouse
        run: npm run test:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 5

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Pages allows one deployment at a time; queue rather than cancel so a
    # merge train doesn't drop the newest commit's publish.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Upload Github Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
