# Outbound links rot on their own schedule, so checking them on every push would
# turn unrelated PRs red. This runs weekly and never gates a deploy.

name: External link check

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Installing @jamesjnadeau/content-tools from GitHub Packages, which needs a
  # token even for a public package. The package is public, so any workflow's
  # GITHUB_TOKEN can read it; if it's ever made private again, grant this
  # repository Read under the package's "Manage Actions access".
  packages: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # @jamesjnadeau/content-tools comes from GitHub Packages (see .npmrc).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesjnadeau'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Check external links
        run: npm run test:links:external
