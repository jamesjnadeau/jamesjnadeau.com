# Builds the site once and runs the whole test suite against those exact bytes,
# on every pull request and every push to master. It publishes nothing: Netlify
# builds and deploys the site itself (netlify.toml), with a deploy preview for
# each pull request, so this is the gate a change has to pass, not the deploy.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Read-only: this workflow only builds and tests.
permissions:
  contents: read
  # Installing @jamesjnadeau/content-tools from GitHub Packages, which needs a
  # token even for a public package. The package is public, so any workflow's
  # GITHUB_TOKEN can read it; if it's ever made private again, grant this
  # repository Read under the package's "Manage Actions access".
  packages: read

# One run per branch. A superseded pull request run is cancelled; master runs
# all finish, so every merged commit has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ubuntu-latest ships google-chrome-stable, so neither Puppeteer nor Lighthouse
# needs to download its own copy (~170MB) on every run.
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # @jamesjnadeau/content-tools comes from GitHub Packages (see .npmrc).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesjnadeau'

      # --omit=dev on purpose: the build must not depend on the test toolchain.
      # Netlify installs devDependencies too, so this is the only thing keeping
      # the dependencies/devDependencies split honest.
      - run: npm ci --omit=dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # @jamesjnadeau/content-tools comes from GitHub Packages (see .npmrc).
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesjnadeau'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Test the build job's artifact rather than rebuilding, so the checks run
      # against one build made with --omit=dev, as a production build would be.
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - run: npm run test:content
      - run: npm run test:html
      - run: npm run test:links
      - run: npm run test:a11y
      - run: npm run test:cms

      - name: Lighthouse
        run: npm run test:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 5
