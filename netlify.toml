# Netlify builds and hosts the site: jamesjnadeau.com points here, and it also
# hosts Netlify Identity and Git Gateway for the ContentTools editor.
# .github/workflows/ci.yml builds and tests the same tree in GitHub Actions as
# the pull request gate, and deploys nothing.
#
# Node comes from .nvmrc, which Netlify reads, so no NODE_VERSION here: one
# pinned version for Actions, Netlify and local dev.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  # Netlify installs devDependencies, and Puppeteer's postinstall would
  # download ~170MB of Chrome on every build for the a11y tests, which only
  # run in GitHub Actions. The build itself never starts a browser.
  PUPPETEER_SKIP_DOWNLOAD = "1"
