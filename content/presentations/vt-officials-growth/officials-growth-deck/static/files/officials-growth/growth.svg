<title id="t">How many officials we would have, by how many new officials join each year</title><desc id="d">Line chart from 2026 to 2032, starting at 41 officials and assuming about 12 percent leave each year. 5 new a year stays at 41. 10 a year reaches about 66 by 2032. 15 a year passes 69 in 2030. 20 a year passes 69 in 2028. Dashed lines mark goal 1 at 44 and goal 2 at 69.</desc>
